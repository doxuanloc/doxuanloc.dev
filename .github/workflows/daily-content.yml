name: Daily content (Grok) + deploy

# MVP: sinh nội dung CHẠY TAY ở LOCAL bằng grok CLI (OAuth, KHÔNG cần XAI_API_KEY):
#   npm run publish:today   (gen → validate → commit → push → host tự deploy)
# Workflow này chỉ là FALLBACK chạy tay trên cloud (cần secret XAI_API_KEY). Đã bỏ cron.
on:
  workflow_dispatch: {} # chỉ chạy tay từ tab Actions

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Install Grok Build CLI
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Generate today's content
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          export PATH="$HOME/.grok/bin:$PATH"
          node scripts/gen-today.mjs

      - name: Validate content (guardrail)
        run: npm run validate

      - name: Commit new content
        run: |
          git config user.name "grok-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/news/
          if git diff --cached --quiet; then
            echo "Không có nội dung mới."
            exit 0
          fi
          git commit -m "content: auto-update $(date -u +%F)"
          git push

      # Deploy: Vercel tự build khi nhận push (khuyến nghị, không cần step này).
      # Nếu muốn build & deploy ngay trong Action, bỏ comment block dưới và đặt secrets Vercel.
      # - name: Build
      #   run: npm run build
